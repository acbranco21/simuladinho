<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fim da sessão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6FED}a:hover{color:#1F4FB8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 32px 40px; background: #F4F6FB; font-family: Nunito, system-ui, sans-serif; color: #1B2340; display: flex; gap: 24px">
  <section style="flex: 1 1 0; min-width: 0; background: #2F6FED; color: #FFFFFF; border-radius: 32px; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
    <svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="34" r="26" fill="#FFFFFF"></circle>
      <circle cx="23" cy="30" r="9" fill="#2F6FED"></circle>
      <circle cx="41" cy="30" r="9" fill="#2F6FED"></circle>
      <circle cx="24" cy="31" r="4" fill="#FFFFFF"></circle>
      <circle cx="40" cy="31" r="4" fill="#FFFFFF"></circle>
      <path d="M26 42 Q32 48 38 42" fill="none" stroke="#F28C28" stroke-width="3" stroke-linecap="round"></path>
    </svg>
    <h1 style="margin: 0; font-size: 52px; font-weight: 900">Missão cumprida!</h1>
    <p style="margin: 0; font-size: 22px; font-weight: 700; color: #EEF3FF">Você terminou o Treino do dia.</p>
    <div style="display: flex; align-items: baseline; gap: 12px; margin-top: 8px">
      <span style="font-size: 96px; font-weight: 900; line-height: 1">8,2</span>
      <span style="font-size: 22px; font-weight: 800; color: #DCE7FF">nota com peso por dificuldade</span>
    </div>
    <span style="background: #F28C28; color: #1B2340; border-radius: 99px; padding: 10px 20px; font-size: 20px; font-weight: 900">Novo recorde em Matemática!</span>
  </section>

  <aside style="width: 480px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 22px; font-weight: 900">Acertos por trilha</h2>
      <sc-for list="{{trilhas}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 800"><span>{{t.nome}}</span><span>{{t.texto}}</span></div>
          <div style="height: 12px; background: #E3E8F4; border-radius: 99px; overflow: hidden"><div style="height: 100%; background: #2F6FED; border-radius: 99px; width: {{t.pct}}"></div></div>
        </div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 800; color: #4D5675">XP ganho</span>
        <span style="font-size: 34px; font-weight: 900">+120</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 800; color: #4D5675">Sequência</span>
        <span style="font-size: 34px; font-weight: 900">7 dias</span>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; align-items: center; gap: 16px">
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="24" r="18" fill="#F28C28"></circle><path d="M28 13 L31 21 L39 21 L33 26 L35 34 L28 29 L21 34 L23 26 L17 21 L25 21 Z" fill="#FFFFFF"></path><path d="M18 38 L14 52 L22 48 L26 54 L28 42 M38 38 L42 52 L34 48 L30 54 L28 42" fill="#2F6FED"></path></svg>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 800; color: #4D5675">Medalha nova</span>
        <span style="font-size: 20px; font-weight: 900">Detetive dos Padrões</span>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
      <a href="Questao.dc.html" style="background: #F28C28; color: #1B2340; text-decoration: none; font-size: 20px; font-weight: 900; padding: 16px 24px; border-radius: 18px; text-align: center">Revisar 2 erros · XP em dobro</a>
      <a href="Main.dc.html" style="background: #FFFFFF; color: #1B2340; text-decoration: none; font-size: 20px; font-weight: 900; padding: 16px 24px; border-radius: 18px; text-align: center; border: 3px solid #D9DEEA">Voltar ao início</a>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      trilhas: [
        { nome: 'Português', texto: '3 de 4', pct: '75%' },
        { nome: 'Matemática', texto: '3 de 3', pct: '100%' },
        { nome: 'Lógica', texto: '2 de 3', pct: '67%' }
      ]
    };
  }
}
</script>
</body>
</html>
