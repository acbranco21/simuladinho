<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Minha evolução</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6FED}a:hover{color:#1F4FB8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 36px; background: #F4F6FB; font-family: Nunito, system-ui, sans-serif; color: #1B2340; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; align-items: center; gap: 18px">
    <a href="Main.dc.html" aria-label="Voltar ao início" style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 34px; font-weight: 900">Minha evolução</h1>
  </header>

  <div style="display: flex; gap: 20px; flex-grow: 1; min-height: 0">
    <section style="flex: 1 1 0; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 22px; font-weight: 900">Notas nos últimos 8 treinos</h2>
        <div style="display: flex; gap: 18px; font-size: 16px; font-weight: 800">
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 5px; border-radius: 3px; background: #2F6FED"></span>Português</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 5px; border-radius: 3px; background: #F28C28"></span>Matemática</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 5px; border-radius: 3px; background: #1B2340"></span>Lógica</span>
        </div>
      </div>
      <svg width="740" height="380" viewBox="0 0 760 380" role="img" aria-label="Gráfico de linhas com as notas de Português, Matemática e Lógica nos últimos 8 treinos; Matemática subiu para o nível Avanço no quinto treino">
        <g font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="#4D5675">
          <text x="34" y="325" text-anchor="end">4</text>
          <text x="34" y="231" text-anchor="end">6</text>
          <text x="34" y="138" text-anchor="end">8</text>
          <text x="34" y="45" text-anchor="end">10</text>
        </g>
        <g stroke="#E6EAF3" stroke-width="1.5">
          <line x1="44" y1="320" x2="720" y2="320"></line>
          <line x1="44" y1="226.7" x2="720" y2="226.7"></line>
          <line x1="44" y1="133.3" x2="720" y2="133.3"></line>
          <line x1="44" y1="40" x2="720" y2="40"></line>
        </g>
        <line x1="382" y1="30" x2="382" y2="320" stroke="#F28C28" stroke-width="2" stroke-dasharray="6 6"></line>
        <rect x="392" y="22" width="196" height="30" rx="15" fill="#FFF4E8"></rect>
        <text x="490" y="42" text-anchor="middle" font-family="Nunito, sans-serif" font-size="14" font-weight="800" fill="#8A4300">Matemática subiu para Avanço</text>
        <polyline points="60,203.3 152,180 244,189.3 336,161.3 428,170.7 520,142.7 612,152 704,133.3" fill="none" stroke="#2F6FED" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <polyline points="60,180 152,152 244,124 336,105.3" fill="none" stroke="#F28C28" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <polyline points="428,161.3 520,142.7 612,133.3 704,114.7" fill="none" stroke="#F28C28" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <polyline points="60,273.3 152,245.3 244,254.7 336,217.3 428,226.7 520,198.7 612,180 704,165.3" fill="none" stroke="#1B2340" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <g font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="#4D5675" text-anchor="middle">
          <text x="60" y="348">1</text><text x="152" y="348">2</text><text x="244" y="348">3</text><text x="336" y="348">4</text>
          <text x="428" y="348">5</text><text x="520" y="348">6</text><text x="612" y="348">7</text><text x="704" y="348">8</text>
          <text x="382" y="374">treino</text>
        </g>
      </svg>
      <p style="margin: 0; font-size: 16px; font-weight: 700; color: #4D5675">Quando o nível sobe, as questões ficam mais difíceis e a nota pode cair um pouco. Isso é normal: é sinal de que você avançou.</p>
    </section>

    <aside style="width: 400px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 900">Mapa de conquistas · Matemática</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{topicos}}" as="t" hint-placeholder-count="9">
            <div style="border-radius: 16px; padding: 12px 10px; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; font-weight: 800; background: {{t.fundo}}; color: {{t.cor}}">{{t.nome}}</div>
          </sc-for>
        </div>
        <span style="font-size: 15px; font-weight: 700; color: #4D5675">6 de 9 tópicos dominados</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 900">Medalhas</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{medalhas}}" as="m" hint-placeholder-count="4">
            <div style="border-radius: 16px; padding: 12px; background: {{m.fundo}}; font-size: 15px; font-weight: 800; color: {{m.cor}}">{{m.nome}}</div>
          </sc-for>
        </div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { fundo: '#2F6FED', cor: '#FFFFFF' };
    const off = { fundo: '#F0F2F7', cor: '#4D5675' };
    const topicos = [
      ['Números até 1.000', 1], ['Adição e subtração', 1], ['Multiplicação', 1],
      ['Divisão', 0], ['Horas e calendário', 1], ['Dinheiro', 1],
      ['Medidas', 0], ['Figuras', 1], ['Gráficos', 0]
    ].map(([nome, ok]) => Object.assign({ nome }, ok ? on : off));
    const medalhas = [
      ['Detetive dos Padrões', 1], ['Mestre da Tabuada', 1],
      ['Leitora Atenta', 0], ['7 dias seguidos', 1]
    ].map(([nome, ok]) => Object.assign({ nome }, ok ? { fundo: '#FFF4E8', cor: '#8A4300' } : off));
    return { topicos, medalhas };
  }
}
</script>
</body>
</html>
